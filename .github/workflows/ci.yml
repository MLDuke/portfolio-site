name: CI

# Every job runs on every pull request, with no path filters: the repo is small,
# and a change to packages/ui has to be checked against both apps.
on:
  pull_request:
  push:
    branches: [main, monorepo]
  workflow_dispatch:

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test -w packages/ui

      - name: dist/tokens.css is up to date
        run: npm run build -w packages/ui && git diff --exit-code packages/ui/dist/

  sketchbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Entry structure, the sketch contract, and media weight.
      - name: Validate entries
        run: npm run validate -w apps/sketchbook

      # Covers playground/src and every entries/*/src, then vite.config.ts and
      # the *.test.ts files separately — see playground/tsconfig*.json.
      - name: Typecheck
        run: npm run typecheck -w apps/sketchbook

      # node:test over scripts/**/*.test.mjs and entries/*/src/**/*.test.ts.
      - name: Test
        run: npm test -w apps/sketchbook

      # A build passes even when `server.fs.allow` is too narrow, so start the dev
      # server and ask it for a font from packages/ui. A 403 here means the allow
      # list no longer covers the workspace root — see apps/sketchbook/docs/adr/0003.
      - name: Dev server serves packages/ui fonts
        env:
          SKETCHBOOK_PORT: 5199
        run: |
          npm run dev -w apps/sketchbook > "$RUNNER_TEMP/vite.log" 2>&1 &
          url="http://localhost:$SKETCHBOOK_PORT"
          for _ in $(seq 30); do
            curl -sf -o /dev/null "$url/" && break
            sleep 1
          done
          if ! curl -sf -o /dev/null "$url/"; then
            echo "::error::Playground dev server did not start within 30s"
            cat "$RUNNER_TEMP/vite.log"
            exit 1
          fi
          font="$url/@fs$PWD/packages/ui/fonts/IBMPlexSans-Regular.woff2"
          status=$(curl -s -o /dev/null -w '%{http_code}' "$font")
          if [ "$status" != 200 ]; then
            echo "::error::GET $font returned $status, expected 200. server.fs.allow in apps/sketchbook/playground/vite.config.ts must cover packages/ui."
            cat "$RUNNER_TEMP/vite.log"
            exit 1
          fi
          echo "IBMPlexSans-Regular.woff2 served with $status"

  portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint -w apps/portfolio

      - name: Unit tests
        run: npm run test:unit -w apps/portfolio

      # `prebuild` runs `npm run journal` first.
      - name: Build
        run: npm run build -w apps/portfolio
