"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "sh scripts/setup.sh"
archive = """
rm -rf .next
sh .conductor/reap-agentation.sh
"""
run_mode = "concurrent"

[scripts.run.dev]
available_in = [ "local" ]
command = "sh .conductor/reap-agentation.sh && npm run dev -- --port \"$CONDUCTOR_PORT\""
default = true
icon = "play"

[scripts.run.lint]
command = "npm run lint"
icon = "test-tube"

[scripts.run.build]
command = "npm run build"
icon = "package"
