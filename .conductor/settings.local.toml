"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "npm ci"
archive = "rm -rf .next"
run_mode = "concurrent"

[scripts.run.dev]
available_in = [ "local" ]
command = "npm run dev -- --port \"$CONDUCTOR_PORT\""
default = true
icon = "play"

[scripts.run.lint]
command = "npm run lint"
icon = "test-tube"

[scripts.run.build]
command = "npm run build"
icon = "package"
